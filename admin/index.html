<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin — Website editor</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <style>
    .sandbox-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 9999; background: #12100e; color: #f1e9dc; font: 600 13px/1.4 system-ui, sans-serif; padding: 10px 16px; border-radius: 99px; box-shadow: 0 8px 30px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; max-width: calc(100vw - 24px); }
    .sandbox-bar b { color: #e0b77c; }
    .sandbox-bar a { color: #e0b77c; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
    .sandbox-bar svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Sandbox content for the demo (generated by scripts/build-cms-sandbox.mjs). Not used with a real backend. -->
  <script src="repo-files.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js"></script>
  <script>
    // Show a small banner while the admin runs in sandbox mode.
    fetch('config.yml').then(r => r.text()).then(t => {
      if (/^\s*name:\s*test-repo/m.test(t) && !/[?&]nobar/.test(location.search)) {
        const bar = document.createElement('div');
        bar.className = 'sandbox-bar';
        bar.innerHTML = '<b>Sandbox demo</b> Edit anything — changes are not saved. <a href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to site</a>';
        document.body.appendChild(bar);
      }
    });
  </script>
</body>
</html>
